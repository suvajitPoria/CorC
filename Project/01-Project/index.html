<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gray-100">
    <button id="blue" class="w-50 bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-700 m-px">
        Blue
    </button>
    <button id="green" class="w-50 bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-700 m-px">
        Green
    </button>

    <button id="pink" class="w-50 bg-pink-500 text-white px-6 py-3 rounded-lg hover:bg-pink-700 m-px">
        Pink
    </button>

    <button id="gray" class="w-50 bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-700 m-px">
        Gray
    </button>
    <script src="script.js"></script>
</body>
</html>
